name: Reusable Build

on:
  workflow_call:
    inputs:
      component-name:
        description: "Nombre del componente (frontend, backend, etc.)"
        required: true
        type: string
      environment:
        description: "Entorno destino para el artefacto de compilación"
        required: true
        type: string
    outputs:
      build-status:
        description: "Estado final de la compilación"
        value: ${{ jobs.build.outputs.status }}
      artifact-name:
        description: "Nombre del artefacto subido"
        value: ${{ jobs.build.outputs.art-name }}

permissions: {}

jobs:
  build:
    name: Compile ${{ inputs.component-name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.export-outputs.outputs.status }}
      art-name: ${{ steps.export-outputs.outputs.art-name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6

      - name: Compile and Build Package
        run: |
          echo "Compilando código fuente para ${{ inputs.component-name }} en el entorno: ${{ inputs.environment }}..."
          mkdir -p dist/
          echo "Compilación exitosa. Versión generada en dist." > dist/release-info.txt
          echo "GlobalFin Services - Enterprise Package" >> dist/release-info.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: build-artifact-${{ inputs.component-name }}-${{ inputs.environment }}
          path: dist/
          retention-days: 5

      - name: Set Job Outputs
        id: export-outputs
        run: |
          echo "status=COMPLETED_SUCCESSFULLY" >> $GITHUB_OUTPUT
          echo "art-name=build-artifact-${{ inputs.component-name }}-${{ inputs.environment }}" >> $GITHUB_OUTPUT
